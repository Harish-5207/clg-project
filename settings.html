<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body class="app-body">

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="badge">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12L9.5 17.5L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <div>
        <h1><span class="accent">Ad-</span><span class="dark">Reg</span></h1>
        <p class="sidebar-tag">Smart Attendance System</p>
      </div>
    </div>

    <nav class="nav-list">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="students.html" class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        Students
      </a>
      <a href="attendance.html" class="nav-item">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
        Attendance
      </a>
      <a href="reports.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>
        Reports
      </a>
      <a href="settings.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        Settings
      </a>
      <a href="index.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
        Logout
      </a>
    </nav>

    <div class="help-widget">
      <svg viewBox="0 0 24 24"><path d="M12 19v2M12 3a5 5 0 0 0-5 5c0 2 1 3 2 4s1.5 1.5 1.5 3"/><circle cx="12" cy="9" r="0"/></svg>
      <div>
        <p class="help-title">Need Help?</p>
        <p class="help-sub">Contact Support</p>
      </div>
    </div>
  </aside>

  <main class="main-content">

    <header class="content-header">
      <div>
        <h2>System Settings & Preferences</h2>
        <p class="welcome-line">Configure academic thresholds, notifications, and institution details</p>
      </div>
    </header>

    <section class="panel" style="max-width: 680px;">
      <form onsubmit="event.preventDefault(); alert('System Settings Saved Successfully!');">
        <div class="modal-body" style="gap: 18px;">
          <div class="modal-field">
            <label for="minAttendanceThreshold">Minimum Attendance Exam Eligibility Threshold (%)</label>
            <input type="number" id="minAttendanceThreshold" value="75" min="50" max="100" class="modal-select">
          </div>

          <div class="modal-field">
            <label for="academicYearSetting">Current Academic Term</label>
            <input type="text" id="academicYearSetting" value="Academic Term 2024–2025" class="modal-select">
          </div>

          <div class="modal-field">
            <label for="institutionName">Institution Name</label>
            <input type="text" id="institutionName" value="Ad-Reg College of Engineering & Technology" class="modal-select">
          </div>

          <div class="modal-field">
            <label>System Email Alerts</label>
            <label class="toggle-switch" style="margin-top: 4px;">
              <input type="checkbox" checked class="toggle-input">
              <span class="toggle-slider"></span>
              <span>Send automatic low attendance warnings to students (&lt;75%)</span>
            </label>
          </div>
        </div>

        <div style="margin-top: 24px;">
          <button type="submit" class="btn-primary-action">Save System Preferences</button>
        </div>
      </form>
    </section>

  </main>

</div>

<script src="script.js"></script>
</body>
</html>
